<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un mot pour toi</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap">

<style>
/* Socle de base (identique sur les 3 pages) */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
[hidden]{display:none!important}

/* ── PARTIE 1 / 3 ──────────────────────────────────────────────────────────
   Palette : Snow FFF3F2 · Pastel Petal FFCAE4 · Electric Rose F10291
             Dark Raspberry 89235B · Rich Mahogany 250209
   ─────────────────────────────────────────────────────────────────────── */
:root{
  --snow:#FFF3F2;
  --petale:#FFCAE4;
  --rose:#F10291;
  --rose-clair:#FF4FB0;
  --framboise:#89235B;
  --acajou:#250209;
  --texte-doux:#F3B9D6;
  --lueur:rgba(241,2,145,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Quicksand','Trebuchet MS',sans-serif;
  color:var(--snow);
  background:var(--acajou);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

/* Le degrade est une couche fixe a part : sur iPhone,
   background-attachment:fixed n est pas fiable. */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 720px at 80% 20%, rgba(241,2,145,.60) 0%, transparent 62%),
    radial-gradient(760px 620px at 10% 76%, rgba(255,202,228,.20) 0%, transparent 60%),
    linear-gradient(165deg, #250209 0%, #4E0E2F 30%, #89235B 62%, #C00A73 100%);
}

/* pas de delai de 300 ms au tap */
button,a{touch-action:manipulation}

/* ── Cœurs qui flottent en fond ────────────────────────────────────────── */
#flotte{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#flotte svg{position:absolute;bottom:-60px;opacity:.6;animation:monte linear infinite}
@keyframes monte{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  10%{opacity:.65}
  90%{opacity:.5}
  100%{transform:translateY(-118vh) rotate(var(--tour,25deg));opacity:0}
}

/* ── Nuages ────────────────────────────────────────────────────────────── */
.nuages{position:fixed;inset:0;pointer-events:none;z-index:0}
.nuage{position:absolute;opacity:.16;animation:derive 26s ease-in-out infinite alternate}
.nuage:nth-child(1){top:8%;left:-4%;width:120px}
.nuage:nth-child(2){top:22%;right:-2%;width:90px;animation-duration:34s;animation-direction:alternate-reverse}
.nuage:nth-child(3){top:70%;left:4%;width:70px;animation-duration:30s}
@keyframes derive{from{transform:translateX(0)}to{transform:translateX(26px)}}

/* ── Mise en page : un seul écran ──────────────────────────────────────── */
.page{
  position:relative;z-index:1;
  min-height:100%;max-width:640px;margin-inline:auto;
  padding-inline:20px;padding-block:48px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  animation:entree .6s ease;
}
@keyframes entree{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

h1{
  font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;
  font-size:clamp(2.4rem,9vw,3.6rem);line-height:1.1;letter-spacing:-.01em;
  text-wrap:balance;margin:0;color:var(--snow);text-shadow:0 0 44px var(--lueur);
}
.sous{
  font-size:clamp(1rem,3.6vw,1.15rem);color:var(--texte-doux);
  max-width:30ch;line-height:1.6;margin:14px auto 0;
}
.eyebrow{
  font-family:'Fredoka',sans-serif;font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;
  color:var(--petale);background:rgba(255,202,228,.12);border:1px solid rgba(255,202,228,.35);
  border-radius:999px;padding:8px 18px;margin-bottom:24px;
}

/* ── Le chat ───────────────────────────────────────────────────────────── */
.sticker{
  background:#fff;border-radius:28px;padding:10px;
  display:grid;place-items:center;overflow:hidden;
  box-shadow:0 18px 44px rgba(37,2,9,.5), 0 0 0 4px rgba(255,202,228,.22);
}
.sticker img{display:block;width:100%;height:100%;object-fit:contain;border-radius:20px}
.sticker-xl{width:min(240px,60vw);aspect-ratio:1;animation:rebond 3.4s ease-in-out infinite}
@keyframes rebond{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}

/* ── Bouton « Continuer » ──────────────────────────────────────────────── */
.suite{
  display:inline-block;text-decoration:none;margin-top:38px;
  font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:var(--snow);
  background:linear-gradient(150deg,var(--rose-clair),var(--rose));
  border-radius:999px;padding:15px 40px;
  box-shadow:0 10px 32px rgba(241,2,145,.5);
  transition:transform .25s cubic-bezier(.34,1.4,.5,1), box-shadow .25s ease;
}
.suite:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 44px rgba(241,2,145,.75)}
.suite:focus-visible{outline:3px solid var(--snow);outline-offset:4px}

/* ── Où on en est (1/3) ────────────────────────────────────────────────── */
.points{display:flex;gap:9px;margin-top:34px}
.points i{width:7px;height:7px;border-radius:50%;background:rgba(255,202,228,.3)}
.points i.on{background:var(--petale);box-shadow:0 0 12px var(--petale)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
}
</style>
</head>

<body>
<div id="flotte" aria-hidden="true"></div>
<div class="nuages" aria-hidden="true">
  <svg class="nuage" viewBox="0 0 120 60"><g fill="#FFF3F2"><ellipse cx="38" cy="38" rx="30" ry="20"/><ellipse cx="66" cy="30" rx="24" ry="22"/><ellipse cx="88" cy="40" rx="22" ry="16"/></g></svg>
  <svg class="nuage" viewBox="0 0 120 60"><g fill="#FFF3F2"><ellipse cx="38" cy="38" rx="30" ry="20"/><ellipse cx="66" cy="30" rx="24" ry="22"/><ellipse cx="88" cy="40" rx="22" ry="16"/></g></svg>
  <svg class="nuage" viewBox="0 0 120 60"><g fill="#FFF3F2"><ellipse cx="38" cy="38" rx="30" ry="20"/><ellipse cx="66" cy="30" rx="24" ry="22"/><ellipse cx="88" cy="40" rx="22" ry="16"/></g></svg>
</div>

<main class="page">
  <span class="eyebrow">rien que pour toi</span>

  <!-- 🐱 chat n°1 -->
  <div class="sticker sticker-xl">
    <img src="cat.jpg" alt="Un petit chat qui serre un gros cœur rose contre lui">
  </div>

  <!-- ✏️ REMPLACE « toi » par son prénom -->
  <h1>Hey toi&nbsp;💗</h1>
  <p class="sous">J'ai fait ce petit coin d'internet rien que pour toi. Prends ton temps, y'a rien qui presse.</p>

  <a class="suite" href="lettre.html">Continuer&nbsp;→</a>

  <div class="points" aria-label="Page 1 sur 3"><i class="on"></i><i></i><i></i></div>
</main>

<script>
(function(){
  'use strict';
  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var zone = document.getElementById('flotte');
  var teintes = ['#FFCAE4','#FFF3F2','#F10291','#FF4FB0','#FFCAE4'];
  var NS = 'http://www.w3.org/2000/svg';
  for(var i=0;i<14;i++){
    var t = Math.round(10 + Math.random()*20);
    var s = document.createElementNS(NS,'svg');
    s.setAttribute('viewBox','0 0 24 24');
    s.setAttribute('width',t); s.setAttribute('height',t);
    s.style.left = (Math.random()*100) + '%';
    s.style.animationDuration = (13 + Math.random()*14) + 's';
    s.style.animationDelay = (-Math.random()*20) + 's';
    s.style.setProperty('--tour', (Math.random()*80-40) + 'deg');
    var p = document.createElementNS(NS,'path');
    p.setAttribute('d','M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
    p.setAttribute('fill', teintes[i % teintes.length]);
    s.appendChild(p); zone.appendChild(s);
  }
})();
</script>
</body>
</html>
