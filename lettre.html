<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La lettre</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Fredoka:wght@400;500;600;700&family=Quicksand:wght@500;600;700&display=swap">

<style>
/* Socle de base (celui que la page d'accueil reçoit automatiquement) */
:root{
  color-scheme:light;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
img{max-width:100%}
[hidden]{display:none!important}

/* ── PARTIE 2 / 3 : la lettre ─────────────────────────────────────────── */
:root{
  --snow:#FFF3F2;
  --petale:#FFCAE4;
  --rose:#F10291;
  --rose-clair:#FF4FB0;
  --framboise:#89235B;
  --acajou:#250209;
  --texte-doux:#F3B9D6;
  --lueur:rgba(241,2,145,.55);
}

*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  font-family:'Quicksand','Trebuchet MS',sans-serif;
  color:var(--snow);
  background:var(--acajou);
  -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
  overflow-x:hidden;
}

/* Le degrade est une couche fixe a part : sur iPhone,
   background-attachment:fixed n est pas fiable. */
body::before{
  content:'';position:fixed;inset:0;z-index:-1;
  background:
    radial-gradient(900px 720px at 80% 20%, rgba(241,2,145,.60) 0%, transparent 62%),
    radial-gradient(760px 620px at 10% 76%, rgba(255,202,228,.20) 0%, transparent 60%),
    linear-gradient(165deg, #250209 0%, #4E0E2F 30%, #89235B 62%, #C00A73 100%);
}

/* pas de delai de 300 ms au tap */
button,a{touch-action:manipulation}

#flotte{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
#flotte svg{position:absolute;bottom:-60px;opacity:.6;animation:monte linear infinite}
@keyframes monte{
  0%{transform:translateY(0) rotate(0deg);opacity:0}
  10%{opacity:.65}
  90%{opacity:.5}
  100%{transform:translateY(-118vh) rotate(var(--tour,25deg));opacity:0}
}

.page{
  position:relative;z-index:1;
  min-height:100%;max-width:640px;margin-inline:auto;
  padding-inline:20px;padding-block:48px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;
  animation:entree .6s ease;
}
@keyframes entree{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}

h2{
  font-family:'Fredoka','Trebuchet MS',sans-serif;font-weight:600;
  font-size:clamp(1.6rem,6vw,2.3rem);line-height:1.2;
  text-wrap:balance;margin:0;color:var(--snow);text-shadow:0 0 34px rgba(241,2,145,.4);
}
.sous{
  font-size:clamp(1rem,3.6vw,1.15rem);color:var(--texte-doux);
  max-width:30ch;line-height:1.6;margin:14px auto 0;
}

/* ── Enveloppe ─────────────────────────────────────────────────────────── */
.env-zone{perspective:900px;margin-top:30px;--w:min(290px,78vw)}
.env{
  position:relative;width:var(--w);aspect-ratio:29/19;
  border:0;padding:0;background:none;cursor:pointer;display:block;
  transition:transform .35s ease, opacity .5s ease;
}
.env:hover{transform:translateY(-6px) scale(1.02)}
.env:focus-visible{outline:3px solid var(--petale);outline-offset:10px;border-radius:16px}
.env-dos{position:absolute;inset:0;background:var(--framboise);border-radius:14px;box-shadow:0 20px 44px rgba(37,2,9,.55)}
.env-papier{
  position:absolute;left:8%;right:8%;top:14%;height:78%;
  background:var(--snow);border-radius:8px;z-index:2;
  box-shadow:0 2px 14px rgba(37,2,9,.3);
  transition:transform .7s cubic-bezier(.34,1.3,.5,1) .45s;
}
.env-avant{
  position:absolute;inset:0;background:linear-gradient(160deg,var(--rose-clair),var(--rose));border-radius:14px;z-index:3;
  clip-path:polygon(0 100%,0 26%,50% 74%,100% 26%,100% 100%);
}
.env-rabat{
  position:absolute;top:0;left:0;width:100%;height:0;z-index:4;
  border-left:calc(var(--w)/2) solid transparent;
  border-right:calc(var(--w)/2) solid transparent;
  border-top:calc(var(--w)*.36) solid #D7128A;
  transform-origin:top;transform:rotateX(0deg);
  transition:transform .6s ease, z-index 0s .35s;
}
.env-sceau{
  position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);z-index:5;
  width:44px;height:44px;border-radius:50%;background:var(--snow);
  display:grid;place-items:center;box-shadow:0 4px 16px rgba(37,2,9,.45);
  transition:opacity .3s ease, transform .3s ease;
}
.env.ouverte .env-rabat{transform:rotateX(180deg);z-index:1}
.env.ouverte .env-papier{transform:translateY(-62%) scale(1.04)}
.env.ouverte .env-sceau{opacity:0;transform:translate(-50%,-50%) scale(.4)}
.env.partie{opacity:0;transform:scale(.9);pointer-events:none}
.tap{margin-top:26px;font-size:.92rem;color:var(--texte-doux);font-weight:600}

/* ── La lettre ─────────────────────────────────────────────────────────── */
.lettre{
  width:100%;max-width:520px;background:var(--snow);
  border-radius:22px;padding:40px 28px 32px;
  box-shadow:0 26px 60px rgba(37,2,9,.55);
  position:relative;text-align:left;overflow:hidden;
}
.lettre::before{
  content:'';position:absolute;top:0;left:0;right:0;height:10px;
  background:repeating-linear-gradient(90deg,var(--rose) 0 16px,var(--petale) 16px 32px);
}
.lettre p{
  font-family:'Caveat','Segoe Script',cursive;
  font-size:clamp(1.3rem,4.4vw,1.6rem);
  line-height:1.5;color:var(--acajou);margin:0 0 15px;
  opacity:0;transform:translateY(10px);animation:apparait .7s ease forwards;
}
.lettre .signe{text-align:right;color:var(--rose);font-weight:700;margin-top:24px;margin-bottom:0}
@keyframes apparait{to{opacity:1;transform:none}}

/* ── Polaroid ──────────────────────────────────────────────────────────── */
.polaroid{
  background:#fff;padding:11px 11px 42px;border-radius:6px;
  box-shadow:0 16px 34px rgba(37,2,9,.3);transform:rotate(-4deg);
  width:min(190px,52vw);margin:28px auto 0;position:relative;
  opacity:0;animation:apparait .7s ease forwards;
}
.polaroid .cadre{
  aspect-ratio:1;max-width:100%;background:#fff;
  border-radius:3px;display:grid;place-items:center;overflow:hidden;
}
.polaroid .cadre img{width:100%;height:100%;object-fit:contain;display:block}
.polaroid figcaption{
  font-family:'Caveat',cursive;font-size:1.25rem;color:var(--framboise);
  position:absolute;left:0;right:0;bottom:9px;text-align:center;margin:0;
}

/* ── Bouton « Continuer » ──────────────────────────────────────────────── */
.suite{
  display:inline-block;text-decoration:none;margin-top:34px;
  font-family:'Fredoka',sans-serif;font-size:1.1rem;font-weight:600;color:var(--snow);
  background:linear-gradient(150deg,var(--rose-clair),var(--rose));
  border-radius:999px;padding:15px 40px;
  box-shadow:0 10px 32px rgba(241,2,145,.5);
  transition:transform .25s cubic-bezier(.34,1.4,.5,1), box-shadow .25s ease;
  animation:apparait .6s ease both;
}
.suite:hover{transform:translateY(-3px) scale(1.04);box-shadow:0 16px 44px rgba(241,2,145,.75)}
.suite:focus-visible{outline:3px solid var(--snow);outline-offset:4px}

.points{display:flex;gap:9px;margin-top:32px}
.points i{width:7px;height:7px;border-radius:50%;background:rgba(255,202,228,.3)}
.points i.on{background:var(--petale);box-shadow:0 0 12px var(--petale)}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.12s!important}
  .lettre p,.polaroid,.suite{opacity:1;transform:none}
  .polaroid{transform:rotate(-4deg)}
}
</style>
</head>

<body>
<div id="flotte" aria-hidden="true"></div>

<main class="page">
  <h2 id="titreMot">J'ai un truc à te dire</h2>
  <p class="sous" id="consigne">Ouvre l'enveloppe&nbsp;👇</p>

  <div class="env-zone" id="envZone">
    <button class="env" id="env" aria-label="Ouvrir l'enveloppe" aria-expanded="false">
      <span class="env-dos"></span>
      <span class="env-papier"></span>
      <span class="env-avant"></span>
      <span class="env-rabat"></span>
      <span class="env-sceau">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="#F10291" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
      </span>
    </button>
    <p class="tap">clique dessus ✨</p>
  </div>

  <!-- ✏️ TOUT CE TEXTE EST À REMPLACER PAR LE TIEN -->
  <article class="lettre" id="lettre" hidden>
    <p style="animation-delay:.05s">Je sais jamais trop comment dire ces trucs-là en vrai, alors je l'écris.</p>
    <p style="animation-delay:.55s">Quand je reçois la notification de ton message, je suis heureux.</p>
    <p style="animation-delay:1.05s">J'aime tout chez toi, que ce soit ton physique ou ton mental, j'adore…</p>
    <p class="signe" style="animation-delay:1.55s">— moi 💗</p>

    <figure class="polaroid" style="animation-delay:2s">
      <div class="cadre">
        <!-- 🐱 chat n°2 -->
        <img src="cat1.jpg" alt="Un petit chat qui tend un bouquet de roses">
      </div>
      <figcaption>tiens, c'est pour toi ♡</figcaption>
    </figure>
  </article>

  <!-- le bouton n'arrive qu'une fois la lettre lue -->
  <a class="suite" id="suite" href="date.html" hidden>Continuer&nbsp;→</a>

  <div class="points" aria-label="Page 2 sur 3"><i></i><i class="on"></i><i></i></div>
</main>

<script>
(function(){
  'use strict';
  var doux = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ── Cœurs qui montent en fond ─────────────────────────────────── */
  if(!doux){
    var zone = document.getElementById('flotte');
    var teintes = ['#FFCAE4','#FFF3F2','#F10291','#FF4FB0','#FFCAE4'];
    var NS = 'http://www.w3.org/2000/svg';
    for(var i=0;i<14;i++){
      var t = Math.round(10 + Math.random()*20);
      var s = document.createElementNS(NS,'svg');
      s.setAttribute('viewBox','0 0 24 24');
      s.setAttribute('width',t); s.setAttribute('height',t);
      s.style.left = (Math.random()*100) + '%';
      s.style.animationDuration = (13 + Math.random()*14) + 's';
      s.style.animationDelay = (-Math.random()*20) + 's';
      s.style.setProperty('--tour', (Math.random()*80-40) + 'deg');
      var p = document.createElementNS(NS,'path');
      p.setAttribute('d','M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z');
      p.setAttribute('fill', teintes[i % teintes.length]);
      s.appendChild(p); zone.appendChild(s);
    }
  }

  /* ── L'enveloppe qui s'ouvre ───────────────────────────────────── */
  var env = document.getElementById('env');
  var envZone = document.getElementById('envZone');
  var consigne = document.getElementById('consigne');
  var titreMot = document.getElementById('titreMot');
  var lettre = document.getElementById('lettre');
  var suite = document.getElementById('suite');
  var ouverte = false;

  env.addEventListener('click', function(){
    if(ouverte) return;
    ouverte = true;
    env.classList.add('ouverte');
    env.setAttribute('aria-expanded','true');
    setTimeout(function(){
      env.classList.add('partie');
      setTimeout(function(){
        // l'enveloppe et son titre s'effacent, la lettre prend toute la place
        envZone.hidden = true;
        consigne.hidden = true;
        titreMot.hidden = true;
        lettre.hidden = false;
        // le bouton arrive une fois la dernière ligne écrite ; sur téléphone
        // il tombe sous l'écran, donc on l'amène doucement à elle
        setTimeout(function(){
          suite.hidden = false;
          suite.scrollIntoView({behavior: doux ? 'auto' : 'smooth', block:'center'});
        }, doux ? 0 : 2600);
      }, 380);
    }, doux ? 80 : 950);
  });
})();
</script>
</body>
</html>
